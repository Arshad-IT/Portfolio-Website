<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F0A1A">
    <title>404 — Page Not Found | Arshad Ali</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.15) 0%, rgba(10, 6, 18, 0.98) 70%);
        }
        .error-card {
            max-width: 520px;
            background: rgba(18, 12, 34, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius-lg);
            padding: clamp(30px, 6vw, 50px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), 0 0 35px rgba(124, 58, 237, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .error-code {
            font-size: clamp(4rem, 12vw, 6.5rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 12px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: clamp(1.3rem, 3.5vw, 1.8rem);
            font-weight: 700;
            margin-bottom: 14px;
            color: #fff;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-1);
            color: #fff;
            padding: 13px 28px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: var(--shadow-primary);
            transition: var(--transition);
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">The digital path you are trying to reach does not exist or has been moved to another location.</p>
            <a href="index.html" class="error-btn">
                <i class="fa-solid fa-house"></i> Back to Home
            </a>
        </div>
    </main>
</body>
</html>
